<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KBS | لوحة تحكم المشرفين</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/styles.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/xlsx/dist/xlsx.full.min.js"></script>
</head>
<body class="bg-gray-100 min-h-screen">

    <!-- Header -->
    <nav class="bg-blue-900 text-white shadow-sm border-b border-blue-800">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <i data-lucide="shield" class="text-blue-300 w-8 h-8 ml-2"></i>
                    <span class="font-bold text-xl font-tajawal">لوحة تحكم المشرفين (Admin)</span>
                </div>
                <div class="flex items-center space-x-4 space-x-reverse">
                    <span id="userNameDisplay" class="font-medium text-blue-200"></span>
                    <button id="logoutBtn" class="text-red-400 hover:text-red-300 p-2 rounded-md transition">
                        <i data-lucide="log-out" class="w-5 h-5"></i>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-8">
        
        <!-- Live Monitor -->
        <section>
            <h2 class="text-2xl font-bold text-gray-800 mb-4 flex items-center">
                <i data-lucide="activity" class="w-6 h-6 ml-2 text-blue-600"></i> مؤشر البث اللحظي للعمال
            </h2>
            <div id="workersMonitor" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Worker cards populated by JS -->
                <div class="text-gray-500 text-sm">جاري جلب البيانات...</div>
            </div>
        </section>

        <!-- Actions Row -->
        <section class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- Upload Panel -->
            <div class="bg-white rounded-xl shadow-sm border p-6">
                <h3 class="text-lg font-bold text-gray-800 mb-4">رفع دفعة أوردرات جديدة</h3>
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">تعيين للعامل:</label>
                        <select id="workerSelect" class="mt-1 block w-full pl-3 pr-10 py-2 text-base border-gray-300 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm border rounded-md">
                            <option value="">-- اختر العامل --</option>
                            <!-- Populated by JS -->
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">شيت الإكسيل (Shopify/Odoo):</label>
                        <input type="file" id="excelUpload" accept=".xlsx, .xls" class="mt-1 block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 border p-2 rounded">
                    </div>
                    <button id="uploadBtn" class="w-full bg-blue-600 text-white py-2 px-4 rounded-md hover:bg-blue-700 transition">
                        رفع وتكوين الدفعة
                    </button>
                </div>
            </div>
            
            <!-- Quick Actions -->
            <div class="bg-white rounded-xl shadow-sm border p-6">
                <h3 class="text-lg font-bold text-gray-800 mb-4">أدوات وتقارير</h3>
                <div class="grid grid-cols-2 gap-4">
                    <button id="exportManifestBtn" class="flex flex-col items-center justify-center p-4 border rounded-lg hover:bg-gray-50 transition text-blue-600">
                        <i data-lucide="file-spreadsheet" class="w-8 h-8 mb-2"></i>
                        <span class="text-sm font-medium">تصدير تقرير اليوم</span>
                    </button>
                    <button id="viewWarehouseBtn" class="flex flex-col items-center justify-center p-4 border rounded-lg hover:bg-gray-50 transition text-purple-600">
                        <i data-lucide="warehouse" class="w-8 h-8 mb-2"></i>
                        <span class="text-sm font-medium">قوائم سحب البلك</span>
                    </button>
                </div>
            </div>
        </section>

        <!-- Orders Table -->
        <section class="bg-white rounded-xl shadow-sm border overflow-hidden">
            <div class="px-6 py-4 border-b flex justify-between items-center">
                <h3 class="text-lg font-bold text-gray-800">إدارة الأوردرات وحظر LEO</h3>
                <div class="relative">
                    <input type="text" id="searchOrders" placeholder="بحث برقم التتبع أو الأوردر..." class="pl-3 pr-10 py-1 border rounded-md text-sm focus:ring-blue-500 focus:border-blue-500">
                    <i data-lucide="search" class="w-4 h-4 text-gray-400 absolute left-3 top-2"></i>
                </div>
            </div>
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200 text-sm">
                    <thead class="bg-gray-50">
                        <tr>
                            <th scope="col" class="px-6 py-3 text-right font-medium text-gray-500 uppercase tracking-wider">رقم التتبع / الأوردر</th>
                            <th scope="col" class="px-6 py-3 text-right font-medium text-gray-500 uppercase tracking-wider">العامل المعين</th>
                            <th scope="col" class="px-6 py-3 text-right font-medium text-gray-500 uppercase tracking-wider">الحالة</th>
                            <th scope="col" class="px-6 py-3 text-center font-medium text-gray-500 uppercase tracking-wider">حظر (LEO)</th>
                        </tr>
                    </thead>
                    <tbody id="ordersTableBody" class="bg-white divide-y divide-gray-200">
                        <!-- Populated by JS -->
                    </tbody>
                </table>
            </div>
        </section>

    </main>

    <script type="module">
        import { AuthService } from './js/auth.js';
        import { BulkEngine } from './js/bulk-engine.js';
        import { db } from './js/config.js';
        import { ref, onValue, set, update, push } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

        lucide.createIcons();

        // 1. Auth Check
        const user = AuthService.requireRole(['ADMIN']);
        document.getElementById('userNameDisplay').textContent = user.name;
        document.getElementById('logoutBtn').addEventListener('click', () => AuthService.logout());

        document.getElementById('viewWarehouseBtn').addEventListener('click', () => {
            window.location.href = 'warehouse.html';
        });

        // 2. Fetch Users (Packers) for dropdown
        const usersRef = ref(db, 'users');
        onValue(usersRef, (snapshot) => {
            const users = snapshot.val() || {};
            const select = document.getElementById('workerSelect');
            select.innerHTML = '<option value="">-- اختر العامل --</option>';
            
            for (const [uid, u] of Object.entries(users)) {
                if (u.role === 'PACKAGING' && u.isActive) {
                    const opt = document.createElement('option');
                    opt.value = uid;
                    opt.textContent = u.name;
                    select.appendChild(opt);
                }
            }
        });

        // 3. Fetch Orders and Batches for Live Monitor & Table
        let allOrders = {};
        const ordersRef = ref(db, 'orders');
        
        onValue(ordersRef, (snapshot) => {
            allOrders = snapshot.val() || {};
            renderOrdersTable();
            renderLiveMonitor();
        });

        function renderLiveMonitor() {
            const monitorDiv = document.getElementById('workersMonitor');
            monitorDiv.innerHTML = ''; // clear

            // Group orders by worker
            const workerStats = {};
            for (const order of Object.values(allOrders)) {
                if (!order.assignedTo) continue;
                if (!workerStats[order.assignedTo]) {
                    workerStats[order.assignedTo] = { total: 0, completed: 0, name: order.assignedName || order.assignedTo };
                }
                workerStats[order.assignedTo].total++;
                if (order.status === 'Shipped') {
                    workerStats[order.assignedTo].completed++;
                }
            }

            for (const [uid, stats] of Object.entries(workerStats)) {
                const percent = stats.total === 0 ? 0 : Math.round((stats.completed / stats.total) * 100);
                const card = document.createElement('div');
                card.className = 'bg-white rounded-xl shadow-sm border p-5 flex flex-col relative overflow-hidden';
                
                // Color bar on top
                card.innerHTML = `
                    <div class="absolute top-0 left-0 w-full h-1 bg-blue-100">
                        <div class="h-1 bg-blue-600 transition-all duration-1000" style="width: ${percent}%"></div>
                    </div>
                    <div class="flex justify-between items-center mb-4 mt-2">
                        <span class="font-bold text-gray-800">${stats.name}</span>
                        <span class="text-xs font-medium bg-blue-100 text-blue-800 px-2 py-1 rounded-full">${percent}% إنجاز</span>
                    </div>
                    <div class="flex justify-between text-sm text-gray-600">
                        <span>المنجز: <span class="font-bold text-green-600">${stats.completed}</span></span>
                        <span>الإجمالي: <span class="font-bold">${stats.total}</span></span>
                    </div>
                `;
                monitorDiv.appendChild(card);
            }
        }

        function renderOrdersTable() {
            const tbody = document.getElementById('ordersTableBody');
            tbody.innerHTML = '';
            
            // Sort by latest (we don't have createdAt, so we just reverse object keys for now)
            const keys = Object.keys(allOrders).reverse();
            
            for (const key of keys) {
                const order = allOrders[key];
                
                const tr = document.createElement('tr');
                
                // Status Badge
                let statusHtml = `<span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-yellow-100 text-yellow-800">Pending</span>`;
                if(order.status === 'Shipped') {
                    statusHtml = `<span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-green-100 text-green-800">Shipped</span>`;
                }

                // LEO Toggle
                const toggleId = `leo_${key}`;
                const isChecked = order.isLeo ? 'checked' : '';
                const toggleHtml = `
                    <div class="relative inline-block w-10 mr-2 align-middle select-none transition duration-200 ease-in">
                        <input type="checkbox" name="toggle" id="${toggleId}" ${isChecked} data-key="${key}" class="toggle-checkbox absolute block w-5 h-5 rounded-full bg-white border-4 appearance-none cursor-pointer z-10 transition-transform duration-200 ease-in-out"/>
                        <label for="${toggleId}" class="toggle-label block overflow-hidden h-5 rounded-full bg-gray-300 cursor-pointer transition-colors duration-200 ease-in-out"></label>
                    </div>
                `;

                tr.innerHTML = `
                    <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">
                        ${order.trackingNumber} <br>
                        <span class="text-xs text-gray-500">Order: ${order.orderId}</span>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${order.assignedName || order.assignedTo}</td>
                    <td class="px-6 py-4 whitespace-nowrap">${statusHtml}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-center">${toggleHtml}</td>
                `;
                tbody.appendChild(tr);
            }

            // Add event listeners to toggles (Atomic update)
            document.querySelectorAll('.toggle-checkbox').forEach(chk => {
                chk.addEventListener('change', async (e) => {
                    const oKey = e.target.getAttribute('data-key');
                    const newVal = e.target.checked;
                    const updates = {};
                    updates[`/orders/${oKey}/isLeo`] = newVal;
                    await update(ref(db), updates);
                    // UI will auto-update via onValue listener
                });
            });
        }

        // 4. Excel Upload Logic
        document.getElementById('uploadBtn').addEventListener('click', async () => {
            const workerId = document.getElementById('workerSelect').value;
            const fileInput = document.getElementById('excelUpload');
            const file = fileInput.files[0];
            
            if (!workerId || !file) {
                alert("يرجى اختيار عامل وإرفاق ملف إكسيل.");
                return;
            }
            
            const workerName = document.getElementById('workerSelect').options[document.getElementById('workerSelect').selectedIndex].text;

            const reader = new FileReader();
            reader.onload = async (e) => {
                const data = new Uint8Array(e.target.result);
                const workbook = window.XLSX.read(data, {type: 'array'});
                const firstSheetName = workbook.SheetNames[0];
                const worksheet = workbook.Sheets[firstSheetName];
                const json = window.XLSX.utils.sheet_to_json(worksheet);
                
                if (json.length === 0) return;

                // Create Batch
                const newBatchRef = push(ref(db, 'batches'));
                const batchId = newBatchRef.key;
                
                await set(newBatchRef, {
                    assignedTo: workerId,
                    totalOrders: json.length,
                    completedOrders: 0,
                    isPrinted: false,
                    isCompleted: false,
                    createdAt: new Date().toISOString()
                });

                // Push Orders
                const updates = {};
                for (const row of json) {
                    // Adapt to your actual Excel columns
                    const trackingNumber = row['Tracking Number'] || row['tracking_number'] || String(Math.random()).substring(2,8);
                    const orderId = row['Name'] || row['Order ID'] || row['Business Reference Number'];
                    const desc = row['Lineitem name'] || row['Description'] || '';
                    
                    const parsed = BulkEngine.parseDescriptionItems(desc);
                    
                    // Use tracking number as key to prevent duplicates
                    const key = `WAYBILL_${trackingNumber}`;
                    updates[`/orders/${key}`] = {
                        orderId: orderId,
                        trackingNumber: trackingNumber,
                        cod: row['Total'] || row['Cod Amount'] || 0,
                        products: desc,
                        parsedProducts: parsed,
                        assignedTo: workerId,
                        assignedName: workerName,
                        batchId: batchId,
                        status: 'Pending',
                        isLeo: false
                    };
                }

                await update(ref(db), updates);
                alert("تم رفع الدفعة وتعيينها للعامل بنجاح!");
                fileInput.value = ''; // Reset
            };
            reader.readAsArrayBuffer(file);
        });

    </script>
</body>
</html>
