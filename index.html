<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KBS | بوابة الدخول</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/styles.css">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-gray-100 h-screen flex items-center justify-center bg-[url('https://www.transparenttextures.com/patterns/cubes.png')]">

    <div class="glass p-8 rounded-2xl shadow-2xl w-full max-w-md border border-white/40 transform transition-all hover:scale-105 duration-300">
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-blue-100 text-blue-600 mb-4">
                <i data-lucide="package-search" class="w-8 h-8"></i>
            </div>
            <h1 class="text-3xl font-bold text-gray-800 font-tajawal">Korean Beautys</h1>
            <p class="text-gray-500 mt-2 font-cairo">نظام إدارة المخازن والتوزيع</p>
        </div>

        <form id="loginForm" class="space-y-6">
            <div>
                <label for="username" class="block text-sm font-medium text-gray-700">اسم المستخدم</label>
                <div class="mt-1 relative rounded-md shadow-sm">
                    <div class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none">
                        <i data-lucide="user" class="h-5 w-5 text-gray-400"></i>
                    </div>
                    <input type="text" id="username" required
                        class="pl-3 pr-10 py-2 block w-full border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500 sm:text-sm border outline-none transition"
                        placeholder="أدخل اسم المستخدم">
                </div>
            </div>

            <div>
                <label for="password" class="block text-sm font-medium text-gray-700">كلمة المرور</label>
                <div class="mt-1 relative rounded-md shadow-sm">
                    <div class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none">
                        <i data-lucide="lock" class="h-5 w-5 text-gray-400"></i>
                    </div>
                    <input type="password" id="password" required
                        class="pl-3 pr-10 py-2 block w-full border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500 sm:text-sm border outline-none transition"
                        placeholder="••••••••">
                </div>
            </div>

            <div id="errorMessage" class="hidden text-red-500 text-sm font-medium text-center">
                اسم المستخدم أو كلمة المرور غير صحيحة
            </div>

            <div>
                <button type="submit"
                    class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-colors">
                    تسجيل الدخول
                </button>
            </div>
        </form>
    </div>

    <script>
        lucide.createIcons();
    </script>
    <script type="module">
        import { AuthService } from './js/auth.js';

        // Check if already logged in
        const user = AuthService.getCurrentUser();
        if (user) {
            AuthService.redirectBasedOnRole(user.role);
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('errorMessage');
            const submitBtn = e.target.querySelector('button[type="submit"]');

            try {
                errorDiv.classList.add('hidden');
                submitBtn.disabled = true;
                submitBtn.innerHTML = '<i data-lucide="loader-2" class="w-5 h-5 animate-spin"></i>';
                lucide.createIcons();
                
                await AuthService.login(username, password);
            } catch (error) {
                errorDiv.textContent = error.message;
                errorDiv.classList.remove('hidden');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'تسجيل الدخول';
            }
        });
    </script>
</body>
</html>
